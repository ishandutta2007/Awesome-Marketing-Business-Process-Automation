<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#10192e"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="flow-line-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -100; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5px; opacity: 0.7; }
        50% { r: 8px; opacity: 1; }
      }
      .ambient-orb-1 {
        animation: pulseOrb 8s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .ambient-orb-2 {
        animation: pulseOrb 10s ease-in-out infinite alternate;
        transform-origin: 1000px 250px;
      }
      .floating-badges {
        animation: floatSlow 5s ease-in-out infinite alternate;
      }
      .pipeline-track {
        stroke-dasharray: 8, 8;
        animation: dashAnim 6s linear infinite;
      }
      .pulse-node {
        animation: nodePulse 3s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Dynamic Ambient Glow Spheres (Layer 0) -->
  <circle class="ambient-orb-1" cx="220" cy="110" r="140" fill="#0284c7" filter="url(#glow-cyan)"/>
  <circle class="ambient-orb-2" cx="980" cy="220" r="160" fill="#7c3aed" filter="url(#glow-purple)"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Interactive Dynamic Process Workflow Streams (Underground Graphic Elements) -->
  <g>
    <!-- Animated Curved Flow Connector 1 -->
    <path class="pipeline-track" d="M 80,310 C 260,310 280,270 450,270 C 650,270 700,320 920,320 C 1040,320 1100,280 1150,280" fill="none" stroke="url(#flow-line-1)" stroke-width="2.5"/>

    <!-- Flow Connector Nodes -->
    <circle class="pulse-node" cx="80" cy="310" r="5" fill="#38bdf8"/>
    <circle class="pulse-node" cx="450" cy="270" r="6" fill="#818cf8"/>
    <circle class="pulse-node" cx="920" cy="320" r="5" fill="#c084fc"/>
    <circle class="pulse-node" cx="1150" cy="280" r="6" fill="#38bdf8"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Title & Subtitle Guaranteed Crystal Clear & In Foreground -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Top Super-header Pill Badge -->
    <g class="floating-badges" transform="translate(0, -55)">
      <rect x="-180" y="-15" width="360" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-160" cy="0" r="4" fill="#10b981"/>
      <text x="5" y="4.5" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1.5">ENTERPRISE AUTOMATION ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text y="20" fill="url(#text-grad)" font-size="38" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome Marketing &amp; Business Process Automation
    </text>

    <!-- Subtitle -->
    <text y="64" fill="#cbd5e1" font-size="16" font-weight="400" letter-spacing="0.2">
      Curated Stack of SaaS Platforms, Self-Hosted Engines, AI Agents &amp; Open-Source iPaaS Workflows
    </text>
  </g>

  <!-- Interactive Feature Cards / Badges along Bottom (Foreground) -->
  <g class="floating-badges" transform="translate(0, 20)">
    <!-- Card 1: Marketing Automation -->
    <g transform="translate(100, 220)">
      <rect width="215" height="48" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
      <text x="20" y="29" fill="#e2e8f0" font-size="13" font-weight="600">🎯 Marketing Journeys</text>
    </g>

    <!-- Card 2: Workflow Orchestration -->
    <g transform="translate(345, 220)">
      <rect width="235" height="48" rx="8" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.2"/>
      <text x="20" y="29" fill="#e2e8f0" font-size="13" font-weight="600">⚡ Workflow Orchestration</text>
    </g>

    <!-- Card 3: Enterprise BPA & RPA -->
    <g transform="translate(610, 220)">
      <rect width="235" height="48" rx="8" fill="url(#card-grad)" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2"/>
      <text x="20" y="29" fill="#e2e8f0" font-size="13" font-weight="600">🏢 Enterprise BPA &amp; RPA</text>
    </g>

    <!-- Card 4: Open Source & Self-Hosted -->
    <g transform="translate(875, 220)">
      <rect width="225" height="48" rx="8" fill="url(#card-grad)" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.2"/>
      <text x="20" y="29" fill="#e2e8f0" font-size="13" font-weight="600">🔓 100% Self-Hosted</text>
    </g>
  </g>

</svg>
